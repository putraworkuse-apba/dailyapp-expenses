<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ledger</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="theme-color" content="#F2F5F1" />

<link rel="manifest" href='data:application/manifest+json,{"name":"Ledger","short_name":"Ledger","start_url":".","display":"standalone","background_color":"%23F2F5F1","theme_color":"%23F2F5F1","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%2320262A%27/%3E%3Cpath d=%27M28 38h44a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6V44a6 6 0 0 1 6-6Z%27 fill=%27none%27 stroke=%27%23F2F5F1%27 stroke-width=%275%27/%3E%3Ccircle cx=%2768%27 cy=%2758%27 r=%275%27 fill=%27%232F6F62%27/%3E%3C/svg%3E","sizes":"100x100","type":"image/svg+xml","purpose":"any maskable"}]}' />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%2320262A%27/%3E%3Cpath d=%27M28 38h44a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6V44a6 6 0 0 1 6-6Z%27 fill=%27none%27 stroke=%27%23F2F5F1%27 stroke-width=%275%27/%3E%3Ccircle cx=%2768%27 cy=%2758%27 r=%275%27 fill=%27%232F6F62%27/%3E%3C/svg%3E" />

<style>
  html, body { margin: 0; padding: 0; background: #F2F5F1; height: 100%; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #20262A;
  }
  .num { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .disp { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
  button { cursor: pointer; font-family: inherit; }
  input:focus, button:focus-visible { outline: 2px solid #2F6F62; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  #app { height: 100dvh; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .header { padding: calc(20px + env(safe-area-inset-top)) 18px 12px; border-bottom: 1px solid #D8DED9; }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 18px; letter-spacing: -0.2px; }
  .icon-btn { border: none; background: transparent; padding: 6px; border-radius: 8px; display: flex; }
  .export-btn { border: 1px solid #D8DED9; background: #fff; border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #5B6660; }
  .export-btn[disabled] { opacity: 0.6; color: #C9CFC9; }
  .month-nav { display: flex; align-items: center; justify-content: flex-end; margin-top: 8px; gap: 4px; }
  .month-label { font-size: 13px; font-weight: 600; min-width: 108px; text-align: center; }

  .banner { padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .banner-export { background: #E1EDE8; border-bottom: 1px solid #C7DBD3; }
  .banner-link { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #2F6F62; text-decoration: none; }
  .banner-close { border: none; background: transparent; padding: 2px; }

  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 18px calc(90px + env(safe-area-inset-bottom)); }

  .card { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; border: 1px solid #D8DED9; }
  .card-label { font-size: 12px; color: #5B6660; font-weight: 500; margin-bottom: 6px; }
  .card-value { font-size: 20px; font-weight: 600; }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .edit-btn { background: transparent; border: 1px solid #D8DED9; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: #5B6660; }

  .input { border: 1px solid #D8DED9; border-radius: 8px; padding: 9px 10px; font-size: 16px; width: 100%; }
  .input-row { display: flex; gap: 8px; }
  .save-btn { background: #2F6F62; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-size: 13px; font-weight: 600; }

  .add-card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 20px; border: 1px solid #D8DED9; }
  .toggle-row { display: flex; gap: 8px; margin: 8px 0; }
  .toggle-btn { flex: 1; border-radius: 8px; padding: 8px 0; font-size: 13; font-weight: 600; border: 1px solid #D8DED9; background: transparent; color: #5B6660; }
  .toggle-btn.active-needs { border-color: #2F6F62; background: #E1EDE8; color: #2F6F62; }
  .toggle-btn.active-wants { border-color: #C98A2C; background: #F7EAD4; color: #9A6414; }
  .add-btn { background: #20262A; color: #fff; border: none; border-radius: 8px; padding: 0 16px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }

  .empty { text-align: center; color: #9AA39D; font-size: 13px; padding: 24px 0; }
  .day-block { margin-bottom: 18px; }
  .day-label { font-size: 11px; font-weight: 600; color: #9AA39D; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; padding-left: 2px; }
  .day-card { background: #fff; border-radius: 12px; border: 1px solid #D8DED9; overflow: hidden; }
  .entry-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid #EEF1EC; }
  .entry-row:first-child { border-top: none; }
  .type-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .entry-item { flex: 1; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
  .entry-price { font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .del-btn { border: none; background: transparent; padding: 2px; flex-shrink: 0; }

  .save-error { position: fixed; bottom: calc(78px + env(safe-area-inset-bottom)); left: 18px; right: 18px; background: #C98A2C; color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .balance-bar { position: fixed; bottom: calc(58px + env(safe-area-inset-bottom)); left: 0; right: 0; background: #fff; border-top: 1px solid #D8DED9; padding: 10px 18px; display: flex; justify-content: space-between; align-items: baseline; }
  .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(58px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: #fff; border-top: 1px solid #D8DED9; display: flex; }
  .tab-btn { flex: 1; border: none; background: transparent; font-size: 13px; font-weight: 600; color: #9AA39D; border-top: 2px solid transparent; margin-top: -1px; }
  .tab-btn.active { color: #2F6F62; border-top: 2px solid #2F6F62; }

  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .stat-card { background: #fff; border-radius: 12px; border: 1px solid #D8DED9; padding: 12px 14px; }
  .stat-label { font-size: 11px; color: #5B6660; font-weight: 500; margin-bottom: 4px; }
  .stat-value-row { display: flex; align-items: baseline; gap: 6px; }
  .stat-value { font-size: 17px; font-weight: 600; }
  .stat-sub { font-size: 11px; color: #9AA39D; }

  .bar-card { background: #fff; border-radius: 14px; border: 1px solid #D8DED9; padding: 16px; margin-top: 10px; margin-bottom: 16px; }
  .bar-title { font-size: 12px; color: #5B6660; font-weight: 500; margin-bottom: 10px; }
  .bar-row { margin-bottom: 10px; }
  .bar-row-top { display: flex; justify-content: space-between; font-size: 12px; color: #5B6660; margin-bottom: 4px; }
  .bar-track { height: 10px; background: #EEF1EC; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }

  .balance-box { border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .balance-box-label { font-size: 12px; color: #5B6660; font-weight: 500; }
  .balance-box-value { font-size: 26px; font-weight: 600; }

  .daily-card { background: #fff; border-radius: 12px; border: 1px solid #D8DED9; overflow: hidden; }
  .daily-row { display: flex; justify-content: space-between; padding: 10px 14px; border-top: 1px solid #EEF1EC; font-size: 13px; }
  .daily-row:first-child { border-top: none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- helpers ---------- */
function monthKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function monthLabel(d) { return d.toLocaleDateString("en-MY", { month: "long", year: "numeric" }); }
function dayKeyOf(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayLabel(k, todayKey) {
  if (k === todayKey) return "Today";
  var d = new Date(k + "T00:00:00");
  return d.toLocaleDateString("en-MY", { weekday: "short", day: "numeric", month: "short" });
}
function fmt(n) {
  var v = Number(n) || 0;
  return v.toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

/* ---------- icons (inline SVG strings) ---------- */
function svgWallet() {
  return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6F62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14" r="1.2" fill="#2F6F62" stroke="none"/></svg>';
}
function svgDownload(color) {
  return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>';
}
function svgChevron(dir) {
  var d = dir === "left" ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7";
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
}
function svgX(color) {
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14"/><path d="M19 5L5 19"/></svg>';
}
function svgPlus() {
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';
}

/* ---------- state ---------- */
var realToday = new Date();
var realMonthKey = monthKey(realToday);
var todayKey = dayKeyOf(realToday);

var state = {
  viewDate: new Date(),
  tab: "log",
  salary: null,
  editingSalary: false,
  expenses: [],
  saveError: "",
  exportFile: null,
  item: "",
  price: "",
  salaryDraft: "",
  ptype: "Needs"
};

function loadMonth() {
  var key = monthKey(state.viewDate);
  state.salary = lsGet("ledger_salary_" + key);
  state.expenses = lsGet("ledger_expenses_" + key) || [];
  state.editingSalary = state.salary == null;
  state.salaryDraft = state.salary != null ? String(state.salary) : "";
  if (state.exportFile && state.exportFile.href) URL.revokeObjectURL(state.exportFile.href);
  state.exportFile = null;
}
loadMonth();

function computeTotals() {
  var needs = 0, wants = 0, todaySpent = 0;
  for (var i = 0; i < state.expenses.length; i++) {
    var e = state.expenses[i];
    if (e.type === "Needs") needs += e.price; else wants += e.price;
    if (e.date === todayKey) todaySpent += e.price;
  }
  var spent = needs + wants;
  var balance = (state.salary || 0) - spent;
  return { needs: needs, wants: wants, spent: spent, balance: balance, todaySpent: todaySpent };
}
function groupByDay() {
  var map = {};
  for (var i = 0; i < state.expenses.length; i++) {
    var e = state.expenses[i];
    if (!map[e.date]) map[e.date] = [];
    map[e.date].push(e);
  }
  var keys = Object.keys(map).sort().reverse();
  return keys.map(function (k) { return [k, map[k]]; });
}

/* ---------- actions ---------- */
function persistExpenses(next) {
  state.expenses = next;
  var key = monthKey(state.viewDate);
  var ok = lsSet("ledger_expenses_" + key, next);
  state.saveError = ok ? "" : "Couldn't save on this device — storage may be full or disabled.";
}
function saveSalaryAction() {
  var input = document.getElementById("salaryInput");
  var val = parseFloat(input ? input.value : state.salaryDraft);
  if (isNaN(val) || val < 0) return;
  state.salary = val;
  state.editingSalary = false;
  var key = monthKey(state.viewDate);
  var ok = lsSet("ledger_salary_" + key, val);
  state.saveError = ok ? "" : "Couldn't save on this device — storage may be full or disabled.";
  render();
}
function addExpenseAction() {
  var itemEl = document.getElementById("itemInput");
  var priceEl = document.getElementById("priceInput");
  var itemVal = (itemEl ? itemEl.value : state.item).trim();
  var priceVal = parseFloat(priceEl ? priceEl.value : state.price);
  if (!itemVal || isNaN(priceVal) || priceVal <= 0) return;
  var entry = { id: uid(), date: todayKey, item: itemVal, type: state.ptype, price: priceVal };
  persistExpenses([entry].concat(state.expenses));
  state.item = "";
  state.price = "";
  render();
}
function deleteExpenseAction(id) {
  persistExpenses(state.expenses.filter(function (e) { return e.id !== id; }));
  render();
}
function changeMonthAction(delta) {
  var d = new Date(state.viewDate);
  d.setDate(1);
  d.setMonth(d.getMonth() + delta);
  state.viewDate = d;
  loadMonth();
  render();
}
function csvEscape(s) {
  var str = String(s);
  return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
}
function exportCsvAction() {
  if (state.salary == null) return;
  var totals = computeTotals();
  var sorted = state.expenses.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var lines = [
    "Ledger export," + monthLabel(state.viewDate),
    "",
    "Salary," + Number(state.salary).toFixed(2),
    "Total Needs," + totals.needs.toFixed(2),
    "Total Wants," + totals.wants.toFixed(2),
    "Total Spent," + totals.spent.toFixed(2),
    "Balance," + totals.balance.toFixed(2),
    "",
    "Date,Item,Type,Price (RM)"
  ];
  sorted.forEach(function (e) {
    lines.push([e.date, csvEscape(e.item), e.type, e.price.toFixed(2)].join(","));
  });
  try {
    var blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    if (state.exportFile && state.exportFile.href) URL.revokeObjectURL(state.exportFile.href);
    var href = URL.createObjectURL(blob);
    var name = "Ledger-" + monthLabel(state.viewDate).replace(" ", "-") + ".csv";
    state.exportFile = { href: href, name: name };
  } catch (e) {
    state.saveError = "Couldn't build the file — try again.";
  }
  render();
}

/* ---------- render ---------- */
function renderLogView(totals) {
  var html = "";

  html += '<div class="card">';
  if (state.editingSalary) {
    html += '<div class="card-label">Monthly salary (RM)</div>';
    html += '<div class="input-row">';
    html += '<input id="salaryInput" class="input num" type="number" inputmode="decimal" placeholder="e.g. 4500" value="' + esc(state.salaryDraft) + '" />';
    html += '<button class="save-btn" data-action="save-salary">Save</button>';
    html += '</div>';
  } else {
    html += '<div class="row-between">';
    html += '<div><div class="card-label">Monthly salary</div><div class="card-value num">RM ' + fmt(state.salary) + '</div></div>';
    if (monthKey(state.viewDate) === realMonthKey) {
      html += '<button class="edit-btn" data-action="edit-salary">Edit</button>';
    }
    html += '</div>';
  }
  html += '</div>';

  if (monthKey(state.viewDate) === realMonthKey && state.salary != null) {
    html += '<div class="add-card">';
    html += '<div class="card-label">Add today\'s expense &middot; spent RM ' + fmt(totals.todaySpent) + ' today</div>';
    html += '<input id="itemInput" class="input" type="text" placeholder="Item (e.g. Nasi lemak)" value="' + esc(state.item) + '" style="margin-bottom:8px" />';
    html += '<div class="toggle-row">';
    ["Needs", "Wants"].forEach(function (t) {
      var cls = "toggle-btn" + (state.ptype === t ? (t === "Needs" ? " active-needs" : " active-wants") : "");
      html += '<button class="' + cls + '" data-action="set-type" data-type="' + t + '">' + t + '</button>';
    });
    html += '</div>';
    html += '<div class="input-row">';
    html += '<input id="priceInput" class="input num" type="number" inputmode="decimal" placeholder="Price (RM)" value="' + esc(state.price) + '" />';
    html += '<button class="add-btn" data-action="add-expense">' + svgPlus() + 'Add</button>';
    html += '</div>';
    html += '</div>';
  }

  var grouped = groupByDay();
  if (grouped.length === 0) {
    html += '<div class="empty">No expenses logged yet.</div>';
  } else {
    grouped.forEach(function (pair) {
      var date = pair[0], entries = pair[1];
      html += '<div class="day-block">';
      html += '<div class="day-label">' + dayLabel(date, todayKey) + '</div>';
      html += '<div class="day-card">';
      entries.forEach(function (e) {
        var isNeeds = e.type === "Needs";
        html += '<div class="entry-row">';
        html += '<span class="type-dot" style="background:' + (isNeeds ? "#2F6F62" : "#C98A2C") + '"></span>';
        html += '<span class="entry-item">' + esc(e.item) + '</span>';
        html += '<span class="type-badge" style="color:' + (isNeeds ? "#2F6F62" : "#9A6414") + ';background:' + (isNeeds ? "#E1EDE8" : "#F7EAD4") + '">' + e.type + '</span>';
        html += '<span class="entry-price num">' + fmt(e.price) + '</span>';
        html += '<button class="del-btn" data-action="delete-expense" data-id="' + e.id + '">' + svgX("#C9CFC9") + '</button>';
        html += '</div>';
      });
      html += '</div></div>';
    });
  }
  return html;
}

function renderDashboardView(totals) {
  if (state.salary == null) {
    return '<div class="empty" style="padding:40px 0">Set a salary for this month on the Log tab to see the dashboard.</div>';
  }
  var pct = function (n) { return totals.spent > 0 ? Math.round((n / totals.spent) * 100) : 0; };
  var maxVal = Math.max(totals.needs, totals.wants, 1);
  var html = "";

  html += '<div class="dash-grid">';
  html += statCard("Salary", state.salary, null, null);
  html += statCard("Spent", totals.spent, null, null);
  html += statCard("Needs", totals.needs, "#2F6F62", pct(totals.needs) + "%");
  html += statCard("Wants", totals.wants, "#C98A2C", pct(totals.wants) + "%");
  html += '</div>';

  html += '<div class="bar-card"><div class="bar-title">Needs vs Wants</div>';
  [["Needs", totals.needs, "#2F6F62"], ["Wants", totals.wants, "#C98A2C"]].forEach(function (row) {
    var name = row[0], val = row[1], color = row[2];
    var widthPct = Math.max((val / maxVal) * 100, val > 0 ? 3 : 0);
    html += '<div class="bar-row"><div class="bar-row-top"><span>' + name + '</span><span class="num">RM ' + fmt(val) + '</span></div>';
    html += '<div class="bar-track"><div class="bar-fill" style="width:' + widthPct + '%;background:' + color + '"></div></div></div>';
  });
  html += '</div>';

  var neg = totals.balance < 0;
  html += '<div class="balance-box" style="background:' + (neg ? "#FBEAE4" : "#E1EDE8") + '">';
  html += '<div class="balance-box-label">Balance remaining</div>';
  html += '<div class="balance-box-value num" style="color:' + (neg ? "#B5482F" : "#20262A") + '">RM ' + fmt(totals.balance) + '</div></div>';

  html += '<div class="day-label">Daily spend</div>';
  var grouped = groupByDay();
  if (grouped.length === 0) {
    html += '<div class="empty" style="padding:16px 0">No expenses yet this month.</div>';
  } else {
    html += '<div class="daily-card">';
    grouped.forEach(function (pair) {
      var date = pair[0], entries = pair[1];
      var dayTotal = entries.reduce(function (a, e) { return a + e.price; }, 0);
      html += '<div class="daily-row"><span style="color:#5B6660">' + dayLabel(date, todayKey) + '</span><span class="num" style="font-weight:600">RM ' + fmt(dayTotal) + '</span></div>';
    });
    html += '</div>';
  }
  return html;
}
function statCard(label, value, color, sub) {
  var html = '<div class="stat-card"><div class="stat-label">' + label + '</div>';
  html += '<div class="stat-value-row"><span class="stat-value num" style="color:' + (color || "#20262A") + '">RM ' + fmt(value) + '</span>';
  if (sub) html += '<span class="stat-sub">' + sub + '</span>';
  html += '</div></div>';
  return html;
}

function render() {
  var totals = computeTotals();
  var isCurrentMonth = monthKey(state.viewDate) === realMonthKey;
  var html = "";

  html += '<div class="header">';
  html += '<div class="header-row">';
  html += '<div class="brand disp">' + svgWallet() + '<span>Ledger</span></div>';
  html += '<button class="export-btn" data-action="export"' + (state.salary == null ? " disabled" : "") + '>' + svgDownload() + 'Export</button>';
  html += '</div>';
  html += '<div class="month-nav">';
  html += '<button class="icon-btn" data-action="prev-month">' + svgChevron("left") + '</button>';
  html += '<span class="month-label num">' + monthLabel(state.viewDate) + '</span>';
  html += '<button class="icon-btn" data-action="next-month"' + (isCurrentMonth ? ' style="opacity:0.3"' : '') + '>' + svgChevron("right") + '</button>';
  html += '</div></div>';

  if (state.exportFile) {
    html += '<div class="banner banner-export">';
    html += '<a class="banner-link" href="' + state.exportFile.href + '" download="' + esc(state.exportFile.name) + '">' + svgDownload("#2F6F62") + 'Tap to save ' + esc(state.exportFile.name) + '</a>';
    html += '<button class="banner-close" data-action="dismiss-export">' + svgX("#5B8378") + '</button>';
    html += '</div>';
  }

  html += '<div class="content">';
  html += state.tab === "log" ? renderLogView(totals) : renderDashboardView(totals);
  html += '</div>';

  if (state.saveError) {
    html += '<div class="save-error"><span>' + esc(state.saveError) + '</span>';
    html += '<button class="banner-close" data-action="dismiss-error">' + svgX("#fff") + '</button></div>';
  }

  if (state.salary != null) {
    html += '<div class="balance-bar"><span style="font-size:12px;color:#5B6660;font-weight:500">Balance (' + monthLabel(state.viewDate) + ')</span>';
    html += '<span class="num" style="font-size:20px;font-weight:600;color:' + (totals.balance < 0 ? "#B5482F" : "#20262A") + '">RM ' + fmt(totals.balance) + '</span></div>';
  }

  html += '<div class="tab-bar">';
  html += '<button class="tab-btn' + (state.tab === "log" ? " active" : "") + '" data-action="set-tab" data-tab="log">Log</button>';
  html += '<button class="tab-btn' + (state.tab === "dashboard" ? " active" : "") + '" data-action="set-tab" data-tab="dashboard">Dashboard</button>';
  html += '</div>';

  document.getElementById("app").innerHTML = html;
  attachInputListeners();
}

function attachInputListeners() {
  var itemEl = document.getElementById("itemInput");
  var priceEl = document.getElementById("priceInput");
  var salaryEl = document.getElementById("salaryInput");
  if (itemEl) {
    itemEl.addEventListener("input", function () { state.item = itemEl.value; });
    itemEl.addEventListener("keydown", function (e) { if (e.key === "Enter") addExpenseAction(); });
  }
  if (priceEl) {
    priceEl.addEventListener("input", function () { state.price = priceEl.value; });
    priceEl.addEventListener("keydown", function (e) { if (e.key === "Enter") addExpenseAction(); });
  }
  if (salaryEl) {
    salaryEl.addEventListener("input", function () { state.salaryDraft = salaryEl.value; });
    salaryEl.addEventListener("keydown", function (e) { if (e.key === "Enter") saveSalaryAction(); });
    salaryEl.focus();
  }
}

/* ---------- event delegation for all buttons ---------- */
document.getElementById("app").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  if (action === "export") exportCsvAction();
  else if (action === "prev-month") changeMonthAction(-1);
  else if (action === "next-month") { if (monthKey(state.viewDate) !== realMonthKey) changeMonthAction(1); }
  else if (action === "dismiss-export") { if (state.exportFile && state.exportFile.href) URL.revokeObjectURL(state.exportFile.href); state.exportFile = null; render(); }
  else if (action === "dismiss-error") { state.saveError = ""; render(); }
  else if (action === "set-tab") { state.tab = el.getAttribute("data-tab"); render(); }
  else if (action === "save-salary") saveSalaryAction();
  else if (action === "edit-salary") { state.editingSalary = true; render(); }
  else if (action === "set-type") { state.ptype = el.getAttribute("data-type"); render(); }
  else if (action === "add-expense") addExpenseAction();
  else if (action === "delete-expense") deleteExpenseAction(el.getAttribute("data-id"));
});

render();
</script>
</body>
</html>
